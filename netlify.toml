[build]
  publish = "."

# Netlify Permanent 301 Redirects: Enforce https://smaranraut.com.np/

[[redirects]]
  from = "https://smaran-seo.netlify.app/*"
  to = "https://smaranraut.com.np/:splat"
  status = 301
  force = true

